<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LifeSim RPG</title>
    <style>
        /* Base Dark Mode & Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            padding: 12px;
            max-width: 850px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header & Header Info */
        .header {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333333;
            margin-bottom: 10px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.4rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .character-meta {
            font-size: 0.8rem;
            color: #888888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid #333333;
            margin-bottom: 12px;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }

        .tab-btn {
            background: transparent;
            color: #888888;
            border: 1px solid transparent;
            border-bottom: none;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.15s ease;
        }

        .tab-btn:hover {
            color: #ffffff;
        }

        .tab-btn.active {
            color: #000000;
            background-color: #ffffff;
            border-color: #ffffff;
            font-weight: bold;
        }

        /* Main Display Panels */
        .panel {
            display: none;
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .panel.active {
            display: flex;
            flex-direction: column;
        }

        /* Story Panel & Blocks */
        #story-panel {
            gap: 12px;
        }

        .narrative-block {
            color: #ffffff;
            white-space: pre-wrap;
        }

        .user-action-block {
            color: #aaaaaa;
            font-style: italic;
            border-left: 2px solid #555555;
            padding-left: 8px;
        }

        /* Dice Roll Outcome Display */
        .dice-badge {
            display: inline-block;
            background-color: #111111;
            border: 1px solid #ffffff;
            padding: 6px 10px;
            margin: 6px 0;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Generic Tab Data Formatting */
        .data-section {
            margin-bottom: 16px;
        }

        .data-section h3 {
            font-size: 0.9rem;
            border-bottom: 1px dashed #444444;
            padding-bottom: 4px;
            margin-bottom: 8px;
            color: #888888;
            text-transform: uppercase;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 8px;
        }

        .stat-card {
            border: 1px solid #222222;
            padding: 8px;
            background: #050505;
        }

        .stat-name {
            font-size: 0.75rem;
            color: #888888;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .list-item {
            padding: 6px 0;
            border-bottom: 1px solid #111111;
            font-size: 0.9rem;
        }

        /* Action Controls Area */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
            padding-top: 8px;
            border-top: 1px solid #222222;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .choice-btn {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 10px 12px;
            text-align: left;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .choice-btn:hover, .choice-btn:active {
            border-color: #ffffff;
            background-color: #111111;
        }

        .custom-input-group {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex-grow: 1;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 10px;
            font-family: inherit;
            font-size: 0.9rem;
            border-radius: 0;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #ffffff;
        }

        .submit-btn {
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            padding: 10px 16px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            border-radius: 0;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: #333333;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-top">
            <h1>LifeSim</h1>
            <span id="header-cash" style="font-weight: bold;">$0</span>
        </div>
        <div id="character-meta" class="character-meta">Loading character data...</div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('story-panel', this)">Narrative</button>
        <button class="tab-btn" onclick="switchTab('stats-panel', this)">Stats & Mods</button>
        <button class="tab-btn" onclick="switchTab('relationships-panel', this)">Relationships</button>
        <button class="tab-btn" onclick="switchTab('inventory-panel', this)">Inventory</button>
        <button class="tab-btn" onclick="switchTab('events-panel', this)">Events</button>
    </div>

    <div id="story-panel" class="panel active">
        <div class="narrative-block">Initializing engine state...</div>
    </div>

    <div id="stats-panel" class="panel">
        <div class="data-section">
            <h3>Core Stats (0–20 Scale)</h3>
            <div id="stats-grid" class="stat-grid"></div>
        </div>
        <div class="data-section">
            <h3>Status Flags & Conditions</h3>
            <div id="status-flags-list">None</div>
        </div>
    </div>

    <div id="relationships-panel" class="panel">
        <div class="data-section">
            <h3>Known Acquaintances & Connections</h3>
            <div id="relationships-list">No relationships formed yet.</div>
        </div>
    </div>

    <div id="inventory-panel" class="panel">
        <div class="data-section">
            <h3>Possessions & Items</h3>
            <div id="inventory-list">Inventory is empty.</div>
        </div>
    </div>

    <div id="events-panel" class="panel">
        <div class="data-section">
            <h3>Life History Log</h3>
            <div id="events-list">No recorded life events.</div>
        </div>
    </div>

    <div class="controls">
        <div id="choices-container" class="choices-container"></div>

        <div class="custom-input-group">
            <input type="text" id="custom-action" placeholder="Type custom action..." onkeydown="handleKeyPress(event)">
            <button class="submit-btn" onclick="sendCustomAction()">Send</button>
        </div>
    </div>

    <script>
        let cachedState = null;

        window.onload = () => {
            startNewGame();
        };

        // Tab Switching Logic
        function switchTab(panelId, btnElement) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

            document.getElementById(panelId).classList.add('active');
            btnElement.classList.add('active');
        }

        async function startNewGame() {
            try {
                const response = await fetch('/api/new-game', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({}),
                });
                const data = await response.json();

                if (data.player_state) {
                    updateUIState(data.player_state);
                }

                if (data.narration) {
                    if (data.narration.narrative) {
                        setStory(data.narration.narrative);
                    }
                    if (data.narration.choices) {
                        renderChoices(data.narration.choices);
                    }
                }
            } catch (err) {
                console.error("Failed to start game:", err);
                setStory("Error initializing game engine.");
            }
        }

        async function sendAction(actionText) {
            if (!actionText.trim()) return;

            renderChoices([]);
            appendStory(`> ${actionText}`, 'user');

            try {
                const response = await fetch('/api/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: actionText })
                });

                const data = await response.json();

                if (data.error) {
                    appendStory(`[Error: ${data.error}]`);
                    return;
                }

                // Render Dice Roll Outcome if present
                if (data.dice_outcome && data.dice_outcome.roll !== undefined) {
                    renderDiceOutcome(data.dice_outcome);
                }

                // Append Narrative Output
                if (data.narration) {
                    if (data.narration.narrative) {
                        appendStory(data.narration.narrative, 'narrative');
                    }
                    if (data.narration.choices) {
                        renderChoices(data.narration.choices);
                    }
                }

                // Refresh Character Engine State
                if (data.player_state) {
                    updateUIState(data.player_state);
                }

            } catch (err) {
                console.error("Failed to perform action:", err);
                appendStory("[Connection error. Please try again.]");
            }
        }

        function sendCustomAction() {
            const input = document.getElementById('custom-action');
            const actionText = input.value;
            if (actionText.trim()) {
                sendAction(actionText);
                input.value = '';
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendCustomAction();
            }
        }

        function setStory(text) {
            const container = document.getElementById('story-panel');
            container.innerHTML = `<div class="narrative-block">${text}</div>`;
            container.scrollTop = container.scrollHeight;
        }

        function appendStory(text, type = 'narrative') {
            const container = document.getElementById('story-panel');
            const newBlock = document.createElement('div');
            newBlock.className = type === 'user' ? 'user-action-block' : 'narrative-block';
            newBlock.textContent = text;
            container.appendChild(newBlock);
            container.scrollTop = container.scrollHeight;
        }

        // Formats and displays the roll outcome
        function renderDiceOutcome(dice) {
            const container = document.getElementById('story-panel');
            const badge = document.createElement('div');
            badge.className = 'dice-badge';
            
            const rollVal = dice.roll ?? 0;
            const targetDC = dice.dc ?? 'N/A';
            const outcomeStr = (dice.outcome || 'resolved').replace(/_/g, ' ');

            badge.textContent = `[DICE ROLL: ${rollVal} vs DC ${targetDC} \vert{} OUTCOME:${outcomeStr}]`;
            container.appendChild(badge);
            container.scrollTop = container.scrollHeight;
        }

        function renderChoices(choices) {
            const container = document.getElementById('choices-container');
            container.innerHTML = '';

            if (choices && choices.length > 0) {
                choices.forEach((choice) => {
                    const button = document.createElement('button');
                    button.className = 'choice-btn';
                    button.textContent = choice;
                    button.onclick = () => sendAction(choice);
                    container.appendChild(button);
                });
            }
        }

        // Populates UI across all tabs using the exported engine state JSON
        function updateUIState(state) {
            cachedState = state;

            // 1. Header Metadata
            document.getElementById('character-meta').textContent = state.header || '';
            document.getElementById('header-cash').textContent = `$${state.cash ?? 0}`;

            // 2. Core Stats Grid
            const statsGrid = document.getElementById('stats-grid');
            statsGrid.innerHTML = '';
            if (state.stats) {
                for (const [stat, val] of Object.entries(state.stats)) {
                    // Calculate roll modifier derived from stat: (stat - 10) / 2
                    const mod = Math.floor((val - 10) / 2);
                    const modStr = mod >= 0 ? `+${mod}` : `${mod}`;

                    const card = document.createElement('div');
                    card.className = 'stat-card';
                    card.innerHTML = `
                        <div class="stat-name">${stat}</div>
                        <div class="stat-value">${val} <span style="font-size: 0.8rem; color: #888;">(${modStr})</span></div>
                    `;
                    statsGrid.appendChild(card);
                }
            }

            // 3. Status Flags
            const flagsList = document.getElementById('status-flags-list');
            if (state.status_flags && state.status_flags.length > 0) {
                flagsList.innerHTML = state.status_flags.map(f => `<div class="list-item">• ${f}</div>`).join('');
            } else {
                flagsList.innerHTML = `<div class="list-item" style="color: #666;">No active status flags.</div>`;
            }

            // 4. Relationships
            const relsList = document.getElementById('relationships-list');
            if (state.relationships && Object.keys(state.relationships).length > 0) {
                let html = '';
                for (const [name, info] of Object.entries(state.relationships)) {
                    const relType = info.relation || 'Acquaintance';
                    const quality = info.quality ?? 50;
                    html += `<div class="list-item"><strong>${name}</strong> (${relType}) — Quality:${quality}/100</div>`;
                }
                relsList.innerHTML = html;
            } else {
                relsList.innerHTML = `<div class="list-item" style="color: #666;">No known relationships recorded.</div>`;
            }

            // 5. Inventory
            const invList = document.getElementById('inventory-list');
            if (state.inventory && state.inventory.length > 0) {
                invList.innerHTML = state.inventory.map(item => `<div class="list-item">• ${item}</div>`).join('');
            } else {
                invList.innerHTML = `<div class="list-item" style="color: #666;">Inventory is empty.</div>`;
            }

            // 6. Life Events Log
            const eventsList = document.getElementById('events-list');
            if (state.life_events && state.life_events.length > 0) {
                eventsList.innerHTML = state.life_events.map(ev => {
                    const yearStr = ev.year ? `[${ev.year}]
